name: Publish

on:
  pull_request:
    types: [closed]
    branches: ['main']
    # Only files that can change what gets released
    paths:
      - 'index.js'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - 'LICENSE'
      - '.release-it.json'
      - '.github/workflows/publish.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

# One release at a time; never cancel a release halfway
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if:
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    permissions:
      contents: write # For git operations
      id-token: write # For npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Checkout all branches and tags
          token: ${{ secrets.GH_TOKEN }}
      # Node 24 ships npm 11, which supports trusted publishing (needs npm >= 11.5.1).
      # Don't upgrade to npm@latest: npm 12 blocks dependency install scripts by default.
      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Check for changes to release
        id: guard
        run: .github/scripts/should-release.sh
      - name: Audit runtime dependencies # No release with a known high or critical vulnerability
        if: steps.guard.outputs.release == 'true'
        run: npm audit --omit=dev --audit-level=high
      - name: Release # Bumps, runs check:pack, publishes, commits, tags, creates the GitHub release
        if: steps.guard.outputs.release == 'true'
        run: |
          git config user.name "$ACTOR"
          git config user.email "$ACTOR@users.noreply.github.com"
          npm run release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ACTOR: ${{ github.actor }} # via env, never interpolated into the script
      - name: Attach SBOM to the release # CycloneDX, runtime dependencies only; nothing is bundled
        if: steps.guard.outputs.release == 'true'
        run: |
          # The release commit is tagged; without a tag, release-it found no
          # version to release (for example a fix and its own revert)
          if ! version=$(git describe --tags --exact-match HEAD 2> /dev/null); then
            echo "No release was made, so no SBOM to attach"
            exit 0
          fi
          file="$RUNNER_TEMP/eslint-config-phun-ky-$version.cdx.json"
          node .github/scripts/sbom.mjs > "$file"
          gh release upload "$version" "$file" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # contents: write is enough to upload an asset
  notify:
    name: Notify failed build
    needs: publish
    if: failure()
    runs-on: ubuntu-24.04
    # GITHUB_TOKEN is enough to open an issue; GH_TOKEN is for the release only
    permissions:
      issues: write
    steps:
      - uses: drivendataorg/failed-build-issue-action@940568ce50eeef3f31a920614cefcc6102d2f930 # v1.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          label-name: 'problems: 💔 build failed'
          create-label: false
