version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    # Minor and patch updates are grouped into one PR. Major updates are left
    # ungrouped, so each one gets its own PR that can be tested and merged alone.
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    schedule:
      interval: 'weekly'
    # Only versions published at least 14 days ago: a compromised release is
    # usually caught within days. Security updates still open at once.
    cooldown:
      default-days: 14
    labels:
      - 'mindless: 📦 dependencies'
    commit-message:
      prefix: 'chore: 🤖 '
    allow:
      - dependency-type: direct
  - package-ecosystem: 'github-actions'
    directory: '/'
    # Same grouping as npm: minor and patch together, each major on its own.
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    schedule:
      interval: 'weekly'
    # Same as npm: only versions published at least 14 days ago
    cooldown:
      default-days: 14
    commit-message:
      prefix: 'chore: 🤖 '
    labels:
      - 'mindless: 📦 dependencies'
