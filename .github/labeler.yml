'section: workflows':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - '.github/scripts/**'
'section: repo':
  - changed-files:
      - any-glob-to-any-file:
          - '*'
'experience: developer':
  - changed-files:
      - any-glob-to-any-file:
          - '.editorconfig'
          - '.gitignore'
          - '.prettierrc'
          - '.release-it.json'
          - 'eslint.config.js'
          - '.githooks/**'
'context: github':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
'context: npm':
  - changed-files:
      - any-glob-to-any-file:
          - 'package.json'
          - 'package-lock.json'
'mindless: ✏️ docs':
  - any:
      - head-branch: ['^docs/']
      - changed-files:
          - any-glob-to-any-file:
              - '**/*.md'
# Dependabot's branches too, or sync-labels would remove the label Dependabot
# sets on GitHub Actions updates, which change no lockfile
'mindless: 📦 dependencies':
  - any:
      - head-branch: ['^dependabot/']
      - changed-files:
          - any-glob-to-any-file:
              - 'package-lock.json'

# By branch prefix only, so docs/fix-something is not labelled a bug
'✨ feature':
  - head-branch: ['^feat/']
'problems: 🐛 bug':
  - head-branch: ['^fix/']
'mindless: 🤖 chore':
  - head-branch: ['^chore/']
'improvements: 💡 enhancement':
  - head-branch: ['^improvements/']
