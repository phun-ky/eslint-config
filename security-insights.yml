header:
  schema-version: 2.2.0
  last-updated: '2026-11-16'
  last-reviewed: '2026-11-16'
  url: https://raw.githubusercontent.com/phun-ky/eslint-config/main/security-insights.yml
  comment: |
    Security information for eslint-config-phun-ky, in the OpenSSF Security
    Insights format. Keep it in step with SECURITY.md.

project:
  name: eslint-config-phun-ky
  homepage: https://github.com/phun-ky/eslint-config#readme
  roadmap: https://github.com/phun-ky/eslint-config/blob/main/ROADMAP.md
  funding: https://github.com/sponsors/phun-ky
  administrators:
    - name: Alexander Vassbotn Røyne-Helgesen
      social: https://github.com/phun-ky
      primary: true
  documentation:
    quickstart-guide: https://github.com/phun-ky/eslint-config#usage
    release-process: https://github.com/phun-ky/eslint-config/blob/main/CONTRIBUTING.md#releases
    code-of-conduct: https://github.com/phun-ky/eslint-config/blob/main/CODE_OF_CONDUCT.md
    support-policy: https://github.com/phun-ky/eslint-config/blob/main/SECURITY.md#supported-versions
    signature-verification: https://github.com/phun-ky/eslint-config/blob/main/SECURITY.md#verifying-releases
  repositories:
    - name: eslint-config
      url: https://github.com/phun-ky/eslint-config
      comment: |
        The source of the eslint-config-phun-ky npm package.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    policy: https://github.com/phun-ky/eslint-config/blob/main/SECURITY.md
    comment: |
      Report privately with GitHub's private vulnerability reporting
      (https://github.com/phun-ky/eslint-config/security/advisories/new) or by
      email to the contact below.
    contact:
      name: eslint-config-phun-ky security contact
      email: security@phun-ky.net
      primary: true

repository:
  url: https://github.com/phun-ky/eslint-config
  status: active
  accepts-change-request: true
  accepts-automated-change-request: true
  no-third-party-packages: false
  core-team:
    - name: Alexander Vassbotn Røyne-Helgesen
      social: https://github.com/phun-ky
      primary: true
  documentation:
    contributing-guide: https://github.com/phun-ky/eslint-config/blob/main/CONTRIBUTING.md
    review-policy: https://github.com/phun-ky/eslint-config/blob/main/GOVERNANCE.md#reviews
    security-policy: https://github.com/phun-ky/eslint-config/blob/main/SECURITY.md
    dependency-management-policy: https://github.com/phun-ky/eslint-config/blob/main/SECURITY.md#dependencies
    governance: https://github.com/phun-ky/eslint-config/blob/main/GOVERNANCE.md
  license:
    url: https://github.com/phun-ky/eslint-config/blob/main/LICENSE
    expression: MIT
  release:
    automated-pipeline: true
    changelog: https://github.com/phun-ky/eslint-config/blob/main/CHANGELOG.md
    distribution-points:
      - uri: pkg:npm/eslint-config-phun-ky
        comment: npm package
    attestations:
      - name: npm provenance
        predicate-uri: https://slsa.dev/provenance/v1
        location: https://registry.npmjs.org/-/npm/v1/attestations/eslint-config-phun-ky@{version}
        comment: |
          Every release is published from GitHub Actions with npm trusted
          publishing and a Sigstore-signed provenance attestation. Replace
          {version}, or run npm audit signatures.
      - name: SBOM
        predicate-uri: https://cyclonedx.org/bom
        location: https://github.com/phun-ky/eslint-config/releases/tag/{version}
        comment: |
          A CycloneDX SBOM of the runtime dependencies,
          eslint-config-phun-ky-{version}.cdx.json, is attached to each GitHub
          release from the first release after 3.0.0.
  security:
    assessments:
      self:
        evidence: https://github.com/phun-ky/eslint-config/blob/main/SECURITY.md#security-expectations
        date: '2026-11-16'
        comment: |
          The security policy sets out what the configuration does and does not
          do when ESLint loads it, how its dependencies are chosen and tracked,
          and the accepted exceptions.
    tools:
      - name: CodeQL
        type: SAST
        rulesets:
          - default
        integration:
          adhoc: false
          ci: true
          release: false
        results: {}
        comment: |
          GitHub default setup, scanning the JavaScript and the GitHub Actions
          workflows on every push to main and every pull request.
      - name: Dependabot
        type: SCA
        rulesets:
          - default
        integration:
          adhoc: true
          ci: false
          release: false
        results: {}
        comment: |
          Weekly checks of the npm dependencies and GitHub Actions, with
          update pull requests for versions at least 14 days old, and security
          updates for new advisories.
      - name: Dependency Review
        type: SCA
        rulesets:
          - default
        integration:
          adhoc: false
          ci: true
          release: false
        results: {}
        comment: |
          Fails pull requests that add a dependency with a known high or
          critical vulnerability. npm audit gates every release the same way.
      - name: OpenSSF Scorecard
        type: other
        rulesets:
          - default
        integration:
          adhoc: false
          ci: true
          release: false
        results: {}
        comment: |
          Runs on every push to main; results at
          https://scorecard.dev/viewer/?uri=github.com/phun-ky/eslint-config
